name: iOS simulator probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get --enforce-lockfile
          (cd ios && pod install)

      - name: Destination matrix
        run: |
          set +e
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          picks = [d['udid'] for runtime, items in sorted(devices.items()) if '.iOS-' in runtime for d in items if d['name'].startswith('iPhone')]
          print(picks[-1])
          ")
          echo "UDID=$UDID"

          probe() {
            local label="$1"; shift
            echo
            echo "########## $label"
            xcodebuild -project ios/Runner.xcodeproj -scheme Runner \
              "$@" >/tmp/out.txt 2>&1
            local code=$?
            echo "exit=$code"
            if [ $code -eq 0 ]; then
              head -n 4 /tmp/out.txt
              grep -E "^ *(SDKROOT|PLATFORM_NAME|SUPPORTED_PLATFORMS|ARCHS|EXCLUDED_ARCHS|VALID_ARCHS|NATIVE_ARCH_ACTUAL|ONLY_ACTIVE_ARCH) " /tmp/out.txt | sort -u | head -n 20
            else
              grep -E "Unable to find a destination|Available destinations|platform:iOS Simulator" /tmp/out.txt | head -n 8
            fi
          }

          xcrun simctl shutdown "$UDID" || true
          probe "A showdestinations plain" -showdestinations
          probe "B showdestinations debug+sdk" -configuration Debug -sdk iphonesimulator -showdestinations
          probe "C generic debug+sdk" -configuration Debug -sdk iphonesimulator -destination generic/platform=iOS Simulator -showBuildSettings
          probe "D settings no destination debug+sdk" -configuration Debug -sdk iphonesimulator -showBuildSettings
          probe "E id= debug+sdk" -configuration Debug -sdk iphonesimulator -destination "id=$UDID" -showBuildSettings
          probe "F platform+id debug+sdk" -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$UDID" -showBuildSettings
          probe "G name+os debug+sdk" -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,name=iPhone 17,OS=26.5" -showBuildSettings
          probe "H id= no sdk" -configuration Debug -destination "id=$UDID" -showBuildSettings

          echo
          echo "########## flutter devices"
          flutter devices || true
