name: iOS simulator probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get --enforce-lockfile
          (cd ios && pod install)

      - name: Destination matrix
        run: |
          set +e
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          picks = [d['udid'] for runtime, items in sorted(devices.items()) if '.iOS-' in runtime for d in items if d['name'].startswith('iPhone')]
          print(picks[-1])
          ")
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1 || true

          count() { grep -c "platform:iOS Simulator, arch:" "$1"; }
          dump() {
            echo
            echo "########## $1"
            shift
            "$@" >/tmp/out.txt 2>&1
            echo "exit=$? concrete=$(count /tmp/out.txt)"
            grep -E "platform:iOS Simulator, arch:|Unable to find a destination" /tmp/out.txt | head -n 3
          }

          try_project() {
            echo
            echo "########## $1"
            xcodebuild -project "$2" -scheme Runner -configuration Debug \
              -sdk iphonesimulator -destination "id=$UDID" -showBuildSettings \
              >/tmp/out.txt 2>&1
            echo "exit=$? concrete=$(count /tmp/out.txt)"
            grep -E "platform:iOS Simulator, arch:|Unable to find a destination" /tmp/out.txt | head -n 2
          }

          try_project "T0 baseline current ios" ios/Runner.xcodeproj

          rm -rf /tmp/ios_noarchs
          cp -R ios /tmp/ios_noarchs
          python3 - <<'PY'
          import pathlib
          path = pathlib.Path('/tmp/ios_noarchs/Flutter/Rust.xcconfig')
          lines = path.read_text().splitlines()
          path.write_text('\n'.join(
              '// disabled for probe: ' + line
              if 'ARCHS[sdk=iphonesimulator*]' in line else line
              for line in lines
          ) + '\n')
          PY
          try_project "T1 current ios without ARCHS override" /tmp/ios_noarchs/Runner.xcodeproj

          rm -rf /tmp/ios_norust
          cp -R ios /tmp/ios_norust
          python3 - <<'PY'
          import pathlib
          for name in ('Debug.xcconfig', 'Release.xcconfig'):
              path = pathlib.Path('/tmp/ios_norust/Flutter') / name
              path.write_text('\n'.join(
                  '// disabled for probe: ' + line
                  if line.strip() == '#include "Rust.xcconfig"' else line
                  for line in path.read_text().splitlines()
              ) + '\n')
          PY
          try_project "T2 current ios without Rust.xcconfig" /tmp/ios_norust/Runner.xcodeproj

          rm -rf /tmp/ios_base467
          mkdir -p /tmp/ios_base467
          git archive '6129034e^' ios | tar -x -C /tmp/ios_base467
          mkdir -p /tmp/ios_base467/ios/Flutter
          cp ios/Flutter/Generated.xcconfig /tmp/ios_base467/ios/Flutter/ || true
          cp -R ios/Pods /tmp/ios_base467/ios/Pods || true
          try_project "T3 ios before #467 merge" /tmp/ios_base467/ios/Runner.xcodeproj

          rm -rf /tmp/ios_base465
          mkdir -p /tmp/ios_base465
          git archive 4be18f34 ios | tar -x -C /tmp/ios_base465
          mkdir -p /tmp/ios_base465/ios/Flutter
          cp ios/Flutter/Generated.xcconfig /tmp/ios_base465/ios/Flutter/ || true
          cp -R ios/Pods /tmp/ios_base465/ios/Pods || true
          try_project "T4 ios at #465 base" /tmp/ios_base465/ios/Runner.xcodeproj
