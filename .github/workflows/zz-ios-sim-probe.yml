name: iOS simulator probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get --enforce-lockfile
          (cd ios && pod install)

      - name: Destination matrix
        run: |
          set +e
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          picks = [d['udid'] for runtime, items in sorted(devices.items()) if '.iOS-' in runtime for d in items if d['name'].startswith('iPhone')]
          print(picks[-1])
          ")
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1 || true

          count() { grep -c "platform:iOS Simulator, arch:" "$1"; }
          dump() {
            echo
            echo "########## $1"
            shift
            "$@" >/tmp/out.txt 2>&1
            echo "exit=$? concrete=$(count /tmp/out.txt)"
            grep -E "platform:iOS Simulator, arch:|Unable to find a destination" /tmp/out.txt | head -n 3
          }

          dump "A showdestinations plain" \
            xcodebuild -project ios/Runner.xcodeproj -scheme Runner -showdestinations
          dump "B showdestinations -configuration Debug" \
            xcodebuild -project ios/Runner.xcodeproj -scheme Runner \
            -configuration Debug -showdestinations
          dump "C showdestinations -sdk iphonesimulator" \
            xcodebuild -project ios/Runner.xcodeproj -scheme Runner \
            -sdk iphonesimulator -showdestinations
          dump "D showdestinations -configuration Debug -sdk iphonesimulator" \
            xcodebuild -project ios/Runner.xcodeproj -scheme Runner \
            -configuration Debug -sdk iphonesimulator -showdestinations
          dump "E id= -configuration Debug -sdk" \
            xcodebuild -project ios/Runner.xcodeproj -scheme Runner \
            -configuration Debug -sdk iphonesimulator -destination "id=$UDID" -showBuildSettings

          echo
          echo "########## vanilla flutter project comparison"
          rm -rf /tmp/probeapp
          flutter create --platforms=ios --project-name probeapp /tmp/probeapp >/tmp/create.txt 2>&1
          echo "create exit=$?"
          (cd /tmp/probeapp && flutter pub get >/tmp/pubget.txt 2>&1; echo "pubget exit=$?")
          dump "F vanilla showdestinations -configuration Debug -sdk" \
            xcodebuild -project /tmp/probeapp/ios/Runner.xcodeproj -scheme Runner \
            -configuration Debug -sdk iphonesimulator -showdestinations
          dump "G vanilla id= -configuration Debug -sdk" \
            xcodebuild -project /tmp/probeapp/ios/Runner.xcodeproj -scheme Runner \
            -configuration Debug -sdk iphonesimulator -destination "id=$UDID" -showBuildSettings
