name: iOS simulator probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get --enforce-lockfile
          (cd ios && pod install)

      - name: Destination matrix
        run: |
          set +e
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          picks = [d['udid'] for runtime, items in sorted(devices.items()) if '.iOS-' in runtime for d in items if d['name'].startswith('iPhone')]
          print(picks[-1])
          ")
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1 || true

          count() { grep -c "platform:iOS Simulator, arch:" "$1"; }
          dump() {
            echo
            echo "########## $1"
            shift
            "$@" >/tmp/out.txt 2>&1
            echo "exit=$? concrete=$(count /tmp/out.txt)"
            grep -E "platform:iOS Simulator, arch:|Unable to find a destination" /tmp/out.txt | head -n 3
          }

          dump "E baseline id=" \
            xcodebuild -project ios/Runner.xcodeproj -scheme Runner \
            -configuration Debug -sdk iphonesimulator -destination "id=$UDID" -showBuildSettings
          dump "E2 override ARCHS" \
            xcodebuild -project ios/Runner.xcodeproj -scheme Runner \
            -configuration Debug -sdk iphonesimulator -destination "id=$UDID" \
            ARCHS="arm64 x86_64" -showBuildSettings
          dump "E3 override SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD=NO" \
            xcodebuild -project ios/Runner.xcodeproj -scheme Runner \
            -configuration Debug -sdk iphonesimulator -destination "id=$UDID" \
            SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD=NO -showBuildSettings
          dump "E4 override ONLY_ACTIVE_ARCH=YES" \
            xcodebuild -project ios/Runner.xcodeproj -scheme Runner \
            -configuration Debug -sdk iphonesimulator -destination "id=$UDID" \
            ONLY_ACTIVE_ARCH=YES -showBuildSettings
          dump "E5 override TARGETED_DEVICE_FAMILY" \
            xcodebuild -project ios/Runner.xcodeproj -scheme Runner \
            -configuration Debug -sdk iphonesimulator -destination "id=$UDID" \
            TARGETED_DEVICE_FAMILY="1,2" -showBuildSettings

          echo
          echo "########## vanilla flutter project comparison"
          rm -rf /tmp/probeapp
          flutter create --platforms=ios --project-name probeapp /tmp/probeapp >/tmp/create.txt 2>&1
          echo "create exit=$?"
          (cd /tmp/probeapp && flutter pub get >/tmp/pubget.txt 2>&1; echo "pubget exit=$?")
          dump "G vanilla id= -configuration Debug -sdk" \
            xcodebuild -project /tmp/probeapp/ios/Runner.xcodeproj -scheme Runner \
            -configuration Debug -sdk iphonesimulator -destination "id=$UDID" -showBuildSettings

          keys='SDKROOT|PLATFORM_NAME|EFFECTIVE_PLATFORM_NAME|SUPPORTED_PLATFORMS|SUPPORTS_MACCATALYST|SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD|ARCHS|VALID_ARCHS|EXCLUDED_ARCHS|NATIVE_ARCH_ACTUAL|ONLY_ACTIVE_ARCH|TARGETED_DEVICE_FAMILY|IPHONEOS_DEPLOYMENT_TARGET|ASSETCATALOG_COMPILER_APPICON_NAME|PRODUCT_BUNDLE_IDENTIFIER'
          ours=/tmp/ours.txt
          theirs=/tmp/theirs.txt
          xcodebuild -project ios/Runner.xcodeproj -scheme Runner -configuration Debug \
            -sdk iphonesimulator -showBuildSettings >"$ours" 2>&1
          echo "ours dump exit=$?"
          xcodebuild -project /tmp/probeapp/ios/Runner.xcodeproj -scheme Runner -configuration Debug \
            -sdk iphonesimulator -showBuildSettings >"$theirs" 2>&1
          echo "vanilla dump exit=$?"
          echo
          echo "########## relevant build settings diff (ours vs vanilla)"
          grep -E "^ *($keys) " "$ours" | sort -u >/tmp/ours.k
          grep -E "^ *($keys) " "$theirs" | sort -u >/tmp/theirs.k
          diff /tmp/theirs.k /tmp/ours.k || true
