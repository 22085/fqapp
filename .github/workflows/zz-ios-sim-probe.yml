name: iOS simulator probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get --enforce-lockfile
          (cd ios && pod install)

      - name: Destination matrix
        run: |
          set -u
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          picks = [d['udid'] for runtime, items in sorted(devices.items()) if '.iOS-' in runtime for d in items if d['name'].startswith('iPhone')]
          print(picks[-1])
          ")
          echo "UDID=$UDID"

          probe() {
            local label="$1"; shift
            echo
            echo "########## $label"
            xcrun simctl list devices | grep -F "$UDID" || true
            xcodebuild -project ios/Runner.xcodeproj -scheme Runner \
              -configuration Debug -sdk iphonesimulator "$@" -showBuildSettings \
              >/tmp/out.txt 2>&1
            local code=$?
            echo "exit=$code"
            if [ $code -eq 0 ]; then
              grep -E "^( *BUILD_DIR| *SDKROOT| *PLATFORM_NAME| *EFFECTIVE_PLATFORM_NAME| *ARCHS) " /tmp/out.txt || true
            else
              tail -n 6 /tmp/out.txt
            fi
          }

          xcrun simctl shutdown "$UDID" || true
          probe "A shutdown device, -destination id=" -destination "id=$UDID"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          probe "B booted device, -destination id=" -destination "id=$UDID"
          probe "C booted device, platform+id" -destination "platform=iOS Simulator,id=$UDID"
          probe "D booted device, platform+name+os" -destination "platform=iOS Simulator,name=iPhone 17,OS=26.5"
          probe "E booted device, platform+name" -destination "platform=iOS Simulator,name=iPhone 17"
          probe "F booted device, generic" -destination "generic/platform=iOS Simulator"

          sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService || true
          sleep 15
          probe "G after service restart, -destination id=" -destination "id=$UDID"

          xcrun simctl shutdown "$UDID" || true
          sleep 5
          probe "H shutdown again, -destination id=" -destination "id=$UDID"

          echo
          echo "########## flutter devices"
          flutter devices || true
