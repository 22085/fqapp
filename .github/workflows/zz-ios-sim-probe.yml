name: iOS simulator probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get --enforce-lockfile
          (cd ios && pod install)

      - name: Destination matrix
        run: |
          set +e
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          picks = [d['udid'] for runtime, items in sorted(devices.items()) if '.iOS-' in runtime for d in items if d['name'].startswith('iPhone')]
          print(picks[-1])
          ")
          echo "UDID=$UDID"
          echo "xcode-select=$(xcode-select -p)"

          dump() {
            echo
            echo "########## $1"
            shift
            "$@" >/tmp/out.txt 2>&1
            echo "exit=$?"
            head -n 45 /tmp/out.txt
          }

          xcrun simctl shutdown "$UDID" || true
          dump "A showdestinations plain (device shutdown)" \
            xcodebuild -project ios/Runner.xcodeproj -scheme Runner -showdestinations
          dump "B id= shutdown" \
            xcodebuild -project ios/Runner.xcodeproj -scheme Runner -configuration Debug \
            -sdk iphonesimulator -destination "id=$UDID" -showBuildSettings

          echo
          echo "########## retry loop: killall CoreSimulatorService then match id="
          for attempt in 1 2 3 4 5; do
            sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService >/dev/null 2>&1 || true
            sleep 8
            xcodebuild -project ios/Runner.xcodeproj -scheme Runner -configuration Debug \
              -sdk iphonesimulator -destination "id=$UDID" -showBuildSettings >/tmp/out.txt 2>&1
            code=$?
            echo "attempt $attempt exit=$code"
            if [ $code -eq 0 ]; then
              grep -E "^ *(SDKROOT|PLATFORM_NAME) " /tmp/out.txt | sort -u
              break
            fi
            grep -E "Unable to find a destination|Available destinations|platform:iOS Simulator" \
              /tmp/out.txt | head -n 6
          done

          echo
          echo "########## boot then re-check"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          dump "C id= booted" \
            xcodebuild -project ios/Runner.xcodeproj -scheme Runner -configuration Debug \
            -sdk iphonesimulator -destination "id=$UDID" -showBuildSettings
          dump "D showdestinations booted" \
            xcodebuild -project ios/Runner.xcodeproj -scheme Runner -showdestinations
          dump "E generic booted" \
            xcodebuild -project ios/Runner.xcodeproj -scheme Runner -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" -showBuildSettings

          echo
          echo "########## flutter devices booted"
          flutter devices || true
